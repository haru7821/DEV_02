<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>인공신장실 도면 에디터</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Fabric.js : 캔버스 객체 제어 (오프라인 환경 대비 로컬 번들) -->
  <script src="vendor/fabric.min.js"></script>
  <!-- jsPDF : PDF(가로모드) 출력 -->
  <script src="vendor/jspdf.umd.min.js"></script>
</head>
<body>
  <!-- ───────── 상단 네비게이션 ───────── -->
  <header id="top-nav">
    <div class="nav-title">🏥 인공신장실 도면 에디터</div>

    <div class="nav-group">
      <label>가로(mm) <input type="number" id="room-width" value="15000" min="3000" step="100" /></label>
      <label>세로(mm) <input type="number" id="room-height" value="10000" min="3000" step="100" /></label>
      <label>벽두께(mm) <input type="number" id="wall-thickness" value="100" min="50" max="400" step="10" /></label>
      <button id="btn-new-room" title="입력한 크기로 병실 외곽을 새로 그립니다">새 도면</button>
      <button id="btn-load-image" title="기존 도면 사진을 배경으로 불러옵니다">도면 사진 불러오기</button>
      <input type="file" id="image-file-input" accept="image/*" hidden />
    </div>

    <div class="nav-group">
      <label>스냅
        <select id="snap-size">
          <option value="10" selected>100mm</option>
          <option value="50">500mm</option>
          <option value="0">끄기</option>
        </select>
      </label>
      <button id="btn-auto-layout" class="accent" title="탈의실·화장실·창고·간호사실·병상·배관을 자동 배치합니다">자동 배치</button>
      <button id="btn-validate" class="warn" title="병상 간격 / 배관 동선 등 의료 규격을 검증합니다">검증</button>
    </div>

    <div class="nav-group">
      <button id="btn-save-json">JSON 저장</button>
      <button id="btn-load-json">JSON 열기</button>
      <input type="file" id="json-file-input" accept=".json" hidden />
      <button id="btn-blueprint" title="흑백 건축 도면(청사진) 스타일로 전환합니다">도면 모드</button>
      <button id="btn-export-png" title="도면을 PNG 이미지로 저장합니다">PNG</button>
      <button id="btn-export-svg" title="도면을 SVG 벡터 파일로 저장합니다">SVG</button>
      <button id="btn-export-pdf" class="primary">PDF 출력 (가로)</button>
    </div>
  </header>

  <div id="main-layout">
    <!-- ───────── 좌측 에셋 툴바 ───────── -->
    <aside id="asset-toolbar">
      <h3>병상 / 장비</h3>
      <div id="equipment-buttons"><!-- assets.js 데이터로 자동 생성 --></div>

      <h3>부속실</h3>
      <div id="room-buttons"><!-- assets.js 데이터로 자동 생성 --></div>

      <h3>문 / 개구부</h3>
      <div id="door-buttons"><!-- assets.js doorData로 자동 생성 --></div>

      <h3>사용자 시설 추가</h3>
      <div id="custom-asset-form">
        <input type="text" id="custom-name" placeholder="시설 이름 (예: 회복실)" maxlength="20" />
        <div class="custom-size-row">
          <input type="number" id="custom-w" value="2000" min="300" step="100" title="가로(mm)" />
          <span>×</span>
          <input type="number" id="custom-h" value="2000" min="300" step="100" title="세로(mm)" />
          <input type="color" id="custom-color" value="#8BC34A" title="색상" />
        </div>
        <button id="btn-add-custom" class="tool-btn">+ 시설 추가</button>
      </div>

      <h3>편집</h3>
      <div class="edit-grid">
        <button id="btn-undo" class="mini-btn" title="실행 취소 (Ctrl+Z)">↩ 취소</button>
        <button id="btn-redo" class="mini-btn" title="다시 실행 (Ctrl+Y)">↪ 재실행</button>
        <button id="btn-duplicate" class="mini-btn" title="복제 (Ctrl+D) — 크기 조정 상태 그대로 복제">⧉ 복제</button>
        <button id="btn-lock" class="mini-btn" title="선택 객체 잠금/해제">🔒 잠금</button>
        <button id="btn-flip-h" class="mini-btn" title="좌우 반전">⇋ 좌우</button>
        <button id="btn-flip-v" class="mini-btn" title="상하 반전">⇅ 상하</button>
        <button id="btn-front" class="mini-btn" title="맨 앞으로">▲ 앞으로</button>
        <button id="btn-back" class="mini-btn" title="맨 뒤로">▼ 뒤로</button>
      </div>

      <h3>정렬 (다중 선택)</h3>
      <div class="edit-grid">
        <button id="btn-align-left" class="mini-btn" title="왼쪽 정렬">⇤ 좌</button>
        <button id="btn-align-hcenter" class="mini-btn" title="가로 중앙 정렬">↔ 중</button>
        <button id="btn-align-right" class="mini-btn" title="오른쪽 정렬">⇥ 우</button>
        <button id="btn-align-top" class="mini-btn" title="위쪽 정렬">⤒ 상</button>
        <button id="btn-align-vcenter" class="mini-btn" title="세로 중앙 정렬">↕ 중</button>
        <button id="btn-align-bottom" class="mini-btn" title="아래쪽 정렬">⤓ 하</button>
      </div>
      <button id="btn-dist-h" class="tool-btn" title="3개 이상 선택 시 가로 간격을 동일하게">가로 등간격 배치</button>
      <button id="btn-dist-v" class="tool-btn" title="3개 이상 선택 시 세로 간격을 동일하게">세로 등간격 배치</button>

      <h3>도구</h3>
      <button id="btn-group" class="tool-btn">선택 객체 그룹화</button>
      <button id="btn-ungroup" class="tool-btn">그룹 해제</button>
      <button id="btn-add-pipe-inlet" class="tool-btn">급수 배관 (Inlet)</button>
      <button id="btn-add-pipe-drain" class="tool-btn">배수 배관 (Drain)</button>
      <button id="btn-renumber" class="tool-btn">병상 번호 재정렬</button>
      <button id="btn-delete" class="tool-btn danger">선택 삭제 (Del)</button>

      <h3>범례</h3>
      <ul id="legend"><!-- assets.js 데이터로 자동 생성 --></ul>
    </aside>

    <!-- ───────── 중앙 캔버스 ───────── -->
    <main id="canvas-wrap">
      <canvas id="floor-canvas"></canvas>
      <div id="canvas-hint">휠: 확대/축소 · Alt+드래그: 화면 이동 · Del: 삭제 · Ctrl+Z/Y 취소/재실행 · Ctrl+C/V/D 복사/붙여넣기/복제</div>
      <div id="zoom-bar">
        <button id="btn-zoom-out" title="축소">−</button>
        <span id="zoom-label">100%</span>
        <button id="btn-zoom-in" title="확대">+</button>
        <button id="btn-zoom-fit" title="화면에 맞춤">⤢</button>
      </div>
    </main>

    <!-- ───────── 우측 속성 패널 ───────── -->
    <aside id="property-panel">
      <h3>속성</h3>
      <div id="prop-empty">객체를 선택하세요</div>
      <div id="prop-form" hidden>
        <div class="prop-row"><span>이름</span><input type="text" id="prop-name" /></div>
        <div class="prop-row"><span>X (mm)</span><input type="number" id="prop-x" step="100" /></div>
        <div class="prop-row"><span>Y (mm)</span><input type="number" id="prop-y" step="100" /></div>
        <div class="prop-row"><span>가로 (mm)</span><input type="number" id="prop-w" step="100" /></div>
        <div class="prop-row"><span>세로 (mm)</span><input type="number" id="prop-h" step="100" /></div>
        <div class="prop-row"><span>회전 (°)</span><input type="number" id="prop-angle" step="15" /></div>
        <div class="prop-row"><span>정수 필요</span><span id="prop-water">-</span></div>
      </div>

      <h3>검증 결과</h3>
      <div id="validation-report">아직 검증하지 않았습니다.</div>
    </aside>
  </div>

  <!-- 경고 토스트 -->
  <div id="toast" hidden></div>

  <!-- 스크립트 (의존 순서 주의) -->
  <script src="js/assets.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
