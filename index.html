<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>인공신장실 도면 에디터</title>
  <link rel="stylesheet" href="style.css?v=20260728" />
  <!-- Fabric.js : 캔버스 객체 제어 (오프라인 환경 대비 로컬 번들) -->
  <script src="vendor/fabric.min.js"></script>
  <!-- jsPDF : PDF(가로모드) 출력 -->
  <script src="vendor/jspdf.umd.min.js"></script>
</head>
<body>
  <!-- ───────── 상단 네비게이션 ───────── -->
  <header id="top-nav">
    <div class="nav-title">🏥 인공신장실 도면 에디터</div>

    <div class="nav-group">
      <label>가로(mm) <input type="number" id="room-width" value="25000" min="3000" step="100" /></label>
      <label>세로(mm) <input type="number" id="room-height" value="15000" min="3000" step="100" /></label>
      <label>벽두께(mm) <input type="number" id="wall-thickness" value="100" min="50" max="400" step="10" /></label>
      <label>콘솔(mm) <input type="number" id="console-depth" value="600" min="100" max="800" step="10" title="투석 장비 뒤 배관 콘솔의 두께 — 참고 도면 실측 640mm" /></label>
      <button id="btn-new-room" title="입력한 크기로 병실 외곽을 새로 그립니다">새 도면</button>
      <button id="btn-load-image" title="기존 도면 사진을 배경으로 불러옵니다">도면 사진 불러오기</button>
      <input type="file" id="image-file-input" accept="image/*" hidden />
    </div>

    <div class="nav-group">
      <label>스냅
        <select id="snap-size">
          <option value="10" selected>100mm</option>
          <option value="50">500mm</option>
          <option value="0">끄기</option>
        </select>
      </label>
      <button id="btn-validate" class="warn" title="병상 간격 / 배관 동선 등 의료 규격을 검증합니다">검증</button>
    </div>

    <div class="nav-group">
      <button id="btn-save-json">JSON 저장</button>
      <button id="btn-load-json">JSON 열기</button>
      <input type="file" id="json-file-input" accept=".json" hidden />
      <button id="btn-blueprint" title="흑백 건축 도면(청사진) 스타일로 전환합니다">도면 모드</button>
      <button id="btn-export-png" title="도면을 PNG 이미지로 저장합니다">PNG</button>
      <button id="btn-export-svg" title="도면을 SVG 벡터 파일로 저장합니다">SVG</button>
      <button id="btn-export-pdf" class="primary">PDF 출력 (가로)</button>
    </div>
  </header>

  <!-- ───────── 상단 커맨드 바 (편집 · 정렬 · 도구) ───────── -->
  <div id="edit-toolbar">
    <div class="cmd-group" aria-label="편집">
      <button id="btn-undo" class="cmd-btn" title="실행 취소 (Ctrl+Z)">↩ 취소</button>
      <button id="btn-redo" class="cmd-btn" title="다시 실행 (Ctrl+Y)">↪ 재실행</button>
      <button id="btn-duplicate" class="cmd-btn" title="복제 (Ctrl+D) — 크기 조정 상태 그대로 복제">⧉ 복제</button>
      <button id="btn-lock" class="cmd-btn" title="선택 객체 잠금/해제">🔒 잠금</button>
      <button id="btn-flip-h" class="cmd-btn" title="좌우 반전">⇋ 좌우</button>
      <button id="btn-flip-v" class="cmd-btn" title="상하 반전">⇅ 상하</button>
      <button id="btn-front" class="cmd-btn" title="맨 앞으로">▲ 앞</button>
      <button id="btn-back" class="cmd-btn" title="맨 뒤로">▼ 뒤</button>
    </div>
    <div class="cmd-group" aria-label="배분">
      <button id="btn-dist-h" class="cmd-btn" title="3개 이상 선택 시 가로 간격을 동일하게">가로 등간격</button>
      <button id="btn-dist-v" class="cmd-btn" title="3개 이상 선택 시 세로 간격을 동일하게">세로 등간격</button>
    </div>
    <div class="cmd-group" aria-label="도구">
      <button id="btn-group" class="cmd-btn" title="선택 객체를 한 그룹으로">그룹화</button>
      <button id="btn-ungroup" class="cmd-btn" title="그룹 해제">해제</button>
      <button id="btn-add-pipe-inlet" class="cmd-btn" title="급수 배관 그리기 (더블클릭으로 완료)">급수 배관 (Inlet)</button>
      <button id="btn-add-pipe-drain" class="cmd-btn" title="배수 배관 그리기 (더블클릭으로 완료)">배수 배관 (Drain)</button>
      <button id="btn-renumber" class="cmd-btn" title="병상 번호를 HD1부터 행→열 순으로 재부여">번호 재정렬</button>
      <button id="btn-delete" class="cmd-btn danger" title="선택 삭제 (Del)">🗑 삭제</button>
    </div>
  </div>

  <div id="main-layout">
    <!-- ───────── 좌측 에셋 툴바 (카테고리 클릭 시 Sub 항목 펼침) ───────── -->
    <aside id="asset-toolbar">
      <details class="tb-section" open>
        <summary>⚙ Auto Modeling</summary>
        <div class="tb-body" id="auto-model-panel">
          <div class="prop-row"><span>병상 대수</span><input type="number" id="target-beds" value="20" min="1" max="100" /></div>
          <div class="prop-row"><span>통로 폭(mm)</span><input type="number" id="passage-width" value="1500" min="800" max="4000" step="100" title="마주보는 장비 사이 사람이 이동할 통로 폭" /></div>
          <div class="prop-row"><span>모듈 폭(mm)</span><input type="number" id="module-width" value="1800" min="1750" max="3000" step="50" title="침대+투석기 병상 모듈의 폭 — 모듈끼리 붙여서 배치됩니다" /></div>
          <div class="prop-row"><span>모듈 길이(mm)</span><input type="number" id="module-depth" value="2200" min="1800" max="3200" step="50" title="침대+투석기 병상 모듈의 세로 길이 (침대 길이 기준)" /></div>
          <div class="prop-row"><span>스테이션 좌석</span>
            <select id="station-seats" title="간호 스테이션 2인 데스크 단위 좌석 수 (최대 8석)">
              <option value="2">2석 (1조)</option>
              <option value="4" selected>4석 (2조)</option>
              <option value="6">6석 (3조)</option>
              <option value="8">8석 (4조)</option>
            </select>
          </div>
          <div id="facility-checks"><!-- 시설 체크박스 자동 생성 --></div>
          <button id="btn-auto-model" class="tool-btn" title="누를 때마다 다른 구성의 도면이 자동 생성됩니다">⚙ Auto Modeling 실행</button>
        </div>
      </details>

      <details class="tb-section" open>
        <summary>병상 / 장비</summary>
        <div class="tb-body" id="equipment-buttons"><!-- assets.js 데이터로 자동 생성 --></div>
      </details>

      <details class="tb-section">
        <summary>가구 / 위생기구</summary>
        <div class="tb-body" id="furn-buttons"><!-- assets.js category:"furn" 항목 자동 생성 --></div>
      </details>

      <details class="tb-section">
        <summary>정수실 설비</summary>
        <div class="tb-body" id="wt-buttons"><!-- assets.js category:"wt" 항목 자동 생성 --></div>
      </details>

      <details class="tb-section">
        <summary>부속실</summary>
        <div class="tb-body" id="room-buttons"><!-- assets.js 데이터로 자동 생성 --></div>
      </details>

      <details class="tb-section">
        <summary>문 / 개구부</summary>
        <div class="tb-body" id="door-buttons"><!-- assets.js doorData로 자동 생성 --></div>
      </details>

      <details class="tb-section">
        <summary>사용자 시설 추가</summary>
        <div class="tb-body" id="custom-asset-form">
          <input type="text" id="custom-name" placeholder="시설 이름 (예: 회복실)" maxlength="20" />
          <div class="custom-size-row">
            <input type="number" id="custom-w" value="2000" min="300" step="100" title="가로(mm)" />
            <span>×</span>
            <input type="number" id="custom-h" value="2000" min="300" step="100" title="세로(mm)" />
            <input type="color" id="custom-color" value="#8BC34A" title="색상" />
          </div>
          <button id="btn-add-custom" class="tool-btn">+ 시설 추가</button>
        </div>
      </details>

      <details class="tb-section">
        <summary>범례</summary>
        <div class="tb-body">
          <ul id="legend"><!-- assets.js 데이터로 자동 생성 --></ul>
        </div>
      </details>
    </aside>

    <!-- ───────── 중앙 캔버스 ───────── -->
    <main id="canvas-wrap">
      <canvas id="floor-canvas"></canvas>
      <div id="canvas-hint">휠: 확대/축소 · Alt+드래그: 화면 이동 · Del: 삭제 · Ctrl+Z/Y 취소/재실행 · Ctrl+C/V/D 복사/붙여넣기/복제</div>
      <div id="zoom-bar">
        <button id="btn-zoom-out" title="축소">−</button>
        <span id="zoom-label">100%</span>
        <button id="btn-zoom-in" title="확대">+</button>
        <button id="btn-zoom-fit" title="화면에 맞춤">⤢</button>
      </div>
    </main>

    <!-- ───────── 우측 속성 패널 ───────── -->
    <aside id="property-panel">
      <h3>속성</h3>
      <div id="prop-empty">객체를 선택하세요</div>
      <div id="prop-form" hidden>
        <div class="prop-row"><span>이름</span><input type="text" id="prop-name" /></div>
        <div class="prop-row"><span>X (mm)</span><input type="number" id="prop-x" step="100" /></div>
        <div class="prop-row"><span>Y (mm)</span><input type="number" id="prop-y" step="100" /></div>
        <div class="prop-row"><span>가로 (mm)</span><input type="number" id="prop-w" step="100" /></div>
        <div class="prop-row"><span>세로 (mm)</span><input type="number" id="prop-h" step="100" /></div>
        <div class="prop-row"><span>회전 (°)</span><input type="number" id="prop-angle" step="15" /></div>
        <div class="prop-row"><span>정수 필요</span><span id="prop-water">-</span></div>
      </div>

      <h3>검증 결과</h3>
      <div id="validation-report">아직 검증하지 않았습니다.</div>
    </aside>
  </div>

  <!-- 경고 토스트 -->
  <div id="toast" hidden></div>

  <!-- 스크립트 (의존 순서 주의) -->
  <!-- ?v= : 파일 갱신 시 브라우저가 옛 캐시를 쓰지 않도록 하는 버전 태그
       (HTML만 새로 받고 JS는 캐시된 옛 파일을 쓰면 버튼이 동작하지 않을 수 있음) -->
  <script src="js/assets.js?v=20260728"></script>
  <script src="js/canvas.js?v=20260728"></script>
  <script src="js/validation.js?v=20260728"></script>
  <script src="js/app.js?v=20260728"></script>
</body>
</html>
